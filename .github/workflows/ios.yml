name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Build the app for the iOS simulator (unsigned)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip the simulator app
        run: |
          cd "build/ios/Build/Products/Debug-iphonesimulator"
          zip -qry "$GITHUB_WORKSPACE/TeluguPanchangam-simulator.zip" "Telugu Panchangam.app"

      - uses: actions/upload-artifact@v4
        with:
          name: TeluguPanchangam-iOS-simulator
          path: TeluguPanchangam-simulator.zip
