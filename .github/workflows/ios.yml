name: iOS

on:
  push:
    branches: [master]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Unit tests (simulator)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          ios = sorted((k for k in devices if 'iOS' in k), reverse=True)
          print(next(d['udid'] for k in ios for d in devices[k] if d['name'].startswith('iPhone')))
          ")
          echo "Simulator: $UDID"
          xcodebuild test \
            -project TeluguPanchangam.xcodeproj \
            -scheme TeluguPanchangam \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO | tail -n 200

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project TeluguPanchangam.xcodeproj \
            -scheme TeluguPanchangam \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 200

      - name: Package the .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/TeluguPanchangam.app Payload/
          zip -qry TeluguPanchangam-unsigned.ipa Payload
          ls -la TeluguPanchangam-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TeluguPanchangam-unsigned-ipa
          path: ios/TeluguPanchangam-unsigned.ipa
          if-no-files-found: error
